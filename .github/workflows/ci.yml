name: CI
on: [push, pull_request]
jobs:
  test:
    name: go-${{ matrix.go }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        go: ['1.24', '1.25']
      fail-fast: false
    env:
      GO_VERSION: ${{ matrix.go }}
    steps:
    - uses: actions/checkout@v5
    - name: Setup go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go }}
    - run: make test
    - uses: codecov/codecov-action@v5
      with:
        env_vars: GO_VERSION

  helm:
    name: Helm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v5
    - name: Lint
      run: helm lint .
      working-directory: chart/jupyterhub-kubernetes-backup
    - name: Template
      run: helm template .
      working-directory: chart/jupyterhub-kubernetes-backup
